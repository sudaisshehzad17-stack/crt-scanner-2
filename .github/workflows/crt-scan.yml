name: CRT scan

on:
  schedule:
    - cron: "*/15 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crt-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python crt_scanner.py

      - name: Save sent-alerts list
        run: |
          git config user.name "crt-bot"
          git config user.email "crt-bot@users.noreply.github.com"
          git add sent_alerts.json || true
          git diff --cached --quiet || (git commit -m "update sent alerts" && git push)
